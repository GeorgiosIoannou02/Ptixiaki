[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iot-monitor"
version = "0.1.0"
description = "IoT Environmental Monitoring System for Equipment Spaces with Anomaly Detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "paho-mqtt>=2.1,<3",
    "influxdb-client>=1.49,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/iot_monitor"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
