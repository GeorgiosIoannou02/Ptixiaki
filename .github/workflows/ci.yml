name: Software checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  pipeline:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen
      - name: Initialize an isolated development database
        run: python3 infrastructure/init_env.py
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check real MQTT ingestion, storage and HTTP responses
        run: uv run --frozen --env-file .env python scripts/check_pipeline.py
      - name: Check dashboard and reverse proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
      - name: Show application diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 api worker web mqtt
      - name: Stop the disposable stack
        if: always()
        run: docker compose down --remove-orphans
